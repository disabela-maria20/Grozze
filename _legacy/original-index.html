function filmState(id){if(!state.filters.has(id)){const dates=unique(sessions.filter(s=>s.movie===id).map(s=>s.date)).sort();state.filters.set(id,{date:dates[0]||'',tech:'Todos',lang:'Todos',cinema:'Todos',open:false});}return state.filters.get(id);}
function filterRows(id,exclude=''){const f=filmState(id);return sessions.filter(s=>s.movie===id&&s.date===f.date&&(exclude==='tech'||f.tech==='Todos'||s.tech===f.tech)&&(exclude==='lang'||f.lang==='Todos'||s.lang===f.lang)&&(exclude==='cinema'||f.cinema==='Todos'||s.theater===f.cinema));}
function filterGroup(id,key,label){const f=filmState(id);const day=sessions.filter(s=>s.movie===id&&s.date===f.date),field=key==='cinema'?'theater':key;const vals=unique(day.map(s=>s[field]));if(!vals.length)return '';const available=filterRows(id,key);return `<div class="filter-group"><h4>${label}</h4>${['Todos',...vals].map(v=>{const count=v==='Todos'?available.length:available.filter(s=>s[field]===v).length;return `<button data-action="session-filter" data-id="${id}" data-key="${key}" data-value="${esc(v)}" class="${f[key]===v?'active':''}" aria-pressed="${f[key]===v}" ${count===0?'disabled':''}><span>${esc(key==='cinema'&&v!=='Todos'?cinema(v)?.name||v:v)}</span><small>${count}</small></button>`;}).join('')}</div>`;}
function datesBar(id,type='movie'){const rows=sessions.filter(s=>s[type==='movie'?'movie':'theater']===id);const dates=unique(rows.map(s=>s.date)).sort();let chosen=type==='movie'?filmState(id).date:state.cinemaDates.get(id);if(type==='cinema'&&!chosen){chosen=dates[0]||'';state.cinemaDates.set(id,chosen);}return `<div class="date-tabs" data-drag-rail aria-label="Datas de sessão">${dates.map(d=>{const p=dateParts(d);return `<button class="date-tab ${d===chosen?'active':''}" data-action="date" data-kind="${type}" data-id="${id}" data-date="${d}" aria-pressed="${d===chosen}" aria-label="${dateLabel(d,true)}"><b>${p.day} ${p.month}</b><span>${p.weekday}</span></button>`;}).join('')}</div>`;}
function groupedRooms(rows){const map=new Map();for(const s of rows){const key=[s.room,s.tech,s.lang].join('|');if(!map.has(key))map.set(key,[]);map.get(key).push(s);}const pref=profile()?.preferences||{};const priority=s=>(pref.language&&pref.language!=='Todos'&&s.lang===pref.language?2:0)+(pref.format&&pref.format!=='Todos'&&s.tech===pref.format?1:0);return [...map.values()].sort((a,b)=>priority(b[0])-priority(a[0])||a[0].room.localeCompare(b[0].room,'pt-BR',{numeric:true})||a[0].lang.localeCompare(b[0].lang)).map(r=>r.sort((a,b)=>a.time.localeCompare(b.time)));}
function hours(rows){return `<div class="hours">${rows.map(s=>`<button class="hour" data-action="session" data-session="${esc(s.id)}" aria-label="${esc(s.time+' · '+dateLabel(s.date)+' · '+s.room+' · '+s.tech+' · '+s.lang)}">${s.time}</button>`).join('')}</div>`;}
function roomBlocks(rows,cinemaPage=false){return groupedRooms(rows).map(rr=>`<div class="${cinemaPage?'cinema-room':'room'}" data-room="${esc(rr[0].room)}" data-language="${esc(rr[0].lang)}"><div class="room-label"><strong>${esc(rr[0].room)}</strong><span>${esc(rr[0].tech)} · ${esc(rr[0].lang)}</span></div>${hours(rr)}</div>`).join('');}
function cinemaSessionsBlock(cid,rows){const c=cinema(cid);return `<article class="cinema-session" data-cinema="${cid}"><div class="cinema-session-head"><div><h3>${esc(c?.name||'Cinema')}</h3><p>${esc(c?.address||'')}</p></div><div class="cinema-session-actions">${heart('cinema',cid)}${state.route.scope?'':`<a class="text-link" href="#/cinema/${cid}">Ver cinema ${icon('arrow')}</a>`}</div></div>${roomBlocks(rows)}</article>`;}
// RC2: the educational state is public; personal favorites still require a session.
function favoriteDiscovery(){return `<section class="favorite-program favorite-discovery" data-favorite-discovery aria-labelledby="favorite-discovery-title"><span class="favorite-discovery-icon" aria-hidden="true">${icon('heart')}</span><div class="favorite-discovery-copy"><h3 id="favorite-discovery-title">Seus cinemas, primeiro.</h3><p>Favorite os cinemas de que você gosta para vê-los em prioridade na programação.</p></div><button class="btn small favorite-discovery-cta" data-action="favorites-auth" aria-haspopup="dialog">Entrar ou criar conta ${icon('arrow')}</button></section>`;}
function programLists(id){const rows=filterRows(id);const groups=new Map();rows.forEach(s=>{if(!groups.has(s.theater))groups.set(s.theater,[]);groups.get(s.theater).push(s);});const fav=[...groups.keys()].filter(cinemaSaved),rest=[...groups.keys()].filter(id=>!cinemaSaved(id));let out='';if(logged()){const any=profile().savedCinemas?.length;out+=`<section class="favorite-program" data-favorite-program><div class="favorite-program-head"><h3>Cinemas favoritos</h3>${!state.route.scope?'<a class="text-link" href="#/cinemas?favoritos=1">Gerenciar favoritos →</a>':''}</div>${fav.length?fav.map(cid=>cinemaSessionsBlock(cid,groups.get(cid))).join(''):`<div class="empty-state"><p>${any?'Nenhum dos seus cinemas favoritos tem sessões para esta seleção.':'Use o coração na lista abaixo para colocar seus cinemas favoritos aqui.'}</p>${!state.route.scope?'<a class="text-link" href="#/cinemas?favoritos=1">Favoritar cinemas →</a>':''}</div>`}</section>`;}else{out+=favoriteDiscovery();}
out+=`<section data-other-program><h3 class="program-group-title">${logged()?'Demais cinemas':'Cinemas'}</h3>${rest.length?rest.map(cid=>cinemaSessionsBlock(cid,groups.get(cid))).join(''):`<div class="empty-state"><p>${rows.length?'Todos os cinemas desta seleção estão nos seus favoritos.':'Nenhuma sessão para os filtros selecionados.'}</p>${!rows.length?`<button class="text-link" data-action="clear-filters" data-id="${id}">Limpar filtros</button>`:''}</div>`}</section>`;return out;}
function program(id){const m=movie(id);if(!hasSessions(id))return `<section id="sessoes" class="program-section"><p class="eyebrow">Programação</p><h2>Escolha sua sessão</h2><div class="no-sessions"><p>Ainda não há sessões disponíveis para esse filme.</p>${validDate(m.releaseDate)&&m.releaseDate>SEED.meta.referenceDate?`<div class="release-highlight"><small>Estreia</small><strong>${dateLabel(m.releaseDate,true)}</strong></div>`:''}</div></section>`;const f=filmState(id);return `<section id="sessoes" class="program-section" data-program-movie="${id}"><p class="eyebrow">Programação</p><h2>Escolha sua sessão</h2><button class="mobile-filter-toggle" data-action="toggle-filters" data-id="${id}" aria-expanded="${f.open}">${icon('filter')}<span>Filtros de sessão</span><span>${f.open?'−':'+'}</span></button><div class="program-grid"><aside class="program-filters ${f.open?'open':''}"><h3>Filtrar sessões</h3>${filterGroup(id,'tech','Experiência')}${filterGroup(id,'lang','Idioma')}${filterGroup(id,'cinema','Cinema')}<button class="text-link" data-action="clear-filters" data-id="${id}">Limpar filtros</button></aside><div class="program-main">${datesBar(id)}<div id="programLists">${programLists(id)}</div></div></div></section>`;}
function relatedNews(m){return SEED.news.filter(n=>n.dist===m.dist);}
function moviePage(id){const m=movie(id);if(!m||state.route.scope&&m.dist!==state.route.scope)return notFound();return `${movieHero(m)}<div class="shell">${program(id)}</div>${newsSection(relatedNews(m),'Notícias relacionadas')}`;}
function filmsPage(){return `<div class="page"><div class="shell"><header class="page-head"><h1>Filmes</h1></header><div class="search-filter-bar"><label class="searchbox">${icon('search')}<input id="filmSearch" data-input="film-search" placeholder="Buscar filme ou gênero" value="${esc(state.filmQuery)}" aria-label="Buscar filme ou gênero"></label><div class="filter-chips" data-drag-rail>${[['all','Todos'],['now','Em cartaz'],['presale','Pré-venda']].map(([v,l])=>`<button class="chip ${state.filmStatus===v?'active':''}" data-action="film-status" data-value="${v}">${l}</button>`).join('')}${['IMAX','VIP','4DX','LED'].map(f=>`<button class="chip ${state.filmFormat===f?'active':''}" data-action="film-format" data-value="${f}">${f}</button>`).join('')}</div></div><div id="catalogResults">${catalogResults()}</div></div></div>`;}
function catalogResults(){const q=normalize(state.filmQuery);const list=movieList().filter(m=>(!q||normalize(m.t+' '+m.genre).includes(q))&&(state.filmStatus==='all'||status(m)===state.filmStatus)&&(state.filmFormat==='all'||sessions.some(s=>s.movie===m.id&&s.tech===state.filmFormat)));return `<div class="catalog-count">${list.length} ${list.length===1?'filme':'filmes'}</div>${list.length?`<div class="catalog-grid">${list.map(m=>card(m)).join('')}</div>`:'<div class="empty-state"><h3>Nenhum filme encontrado</h3><p>Tente outro título ou remova um filtro.</p><button class="text-link" data-action="reset-catalog">Limpar busca e filtros</button></div>'}`;}
function distance(c){const pos=state.location.coords;if(!pos)return null;const rad=d=>d*Math.PI/180;const a=Math.sin(rad(c.lat-pos.lat)/2)**2+Math.cos(rad(pos.lat))*Math.cos(rad(c.lat))*Math.sin(rad(c.lng-pos.lng)/2)**2;return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function sortedCinemas(){return [...baseCinemas.values()].sort((a,b)=>Number(cinemaSaved(b.id))-Number(cinemaSaved(a.id))||(distance(a)??999)-(distance(b)??999)||a.name.localeCompare(b.name));}
function cinemaCard(c){const km=distance(c);return `<article class="cinema-card ${cinemaSaved(c.id)?'favorite':''}" data-cinema-card="${c.id}"><div><a href="#/cinema/${c.id}"><h2>${esc(c.name)}</h2><p>${esc(c.address)}</p></a><small>${km===null?'':km.toFixed(1).replace('.',',')+' km em linha reta · '}${c.roomCount} ${c.roomCount===1?'sala':'salas'} · ${esc(c.tech.join(' · '))}</small></div>${heart('cinema',c.id)}</article>`;}
function cinemaListHtml(){const list=sortedCinemas().filter(c=>(!state.cinemaQuery||normalize(c.name+' '+c.address).includes(normalize(state.cinemaQuery)))&&(state.cinemaFormat==='all'||c.tech.some(t=>t.includes(state.cinemaFormat))));return list.map(cinemaCard).join('')||'<div class="empty-state">Nenhum cinema para esta busca.</div>';}
function cinemasPage(){return `<div class="page"><div class="shell"><header class="page-head"><h1>Cinemas</h1></header><div class="search-filter-bar"><label class="searchbox">${icon('search')}<input data-input="cinema-search" value="${esc(state.cinemaQuery)}" placeholder="Buscar cinema ou bairro" aria-label="Buscar cinema ou bairro"></label><div class="filter-chips" data-drag-rail>${['all','IMAX','VIP','4DX','LED'].map(f=>`<button class="chip ${state.cinemaFormat===f?'active':''}" data-action="cinema-format" data-value="${f}">${f==='all'?'Todos':f}</button>`).join('')}</div></div><div class="cinema-layout"><div class="map-panel" id="cinemaMap"><div class="map-placeholder">${icon('pin')}<h2>Veja os cinemas no mapa</h2><p>O mapa é carregado somente quando você escolher abri-lo.</p><button class="btn" data-action="map">Abrir mapa</button></div></div><div class="cinema-list" id="cinemaList">${cinemaListHtml()}</div></div></div></div>`;}
function cinemaProgram(id){const d=state.cinemaDates.get(id);const rows=sessions.filter(s=>s.theater===id&&s.date===d);const ids=unique(rows.map(s=>s.movie));return ids.map(mid=>{const m=movie(mid);return `<article class="cinema-movie" data-movie="${mid}"><a href="${movieHref(mid)}" aria-label="Ver ${esc(m.t)}">${image(m)}</a><div><h3><a href="${movieHref(mid)}">${esc(m.t)}</a></h3><div class="meta">${esc([m.genre,m.dur].filter(Boolean).join(' · '))}</div>${roomBlocks(rows.filter(s=>s.movie===mid),true)}</div></article>`;}).join('')||'<div class="empty-state">Não há sessões nesta data.</div>';}
function cinemaPage(id){const c=cinema(id);if(!c)return notFound();const dates=datesBar(id,'cinema');return `<div class="page"><div class="shell"><header class="page-head cinema-header"><div><p class="eyebrow">${esc(c.network)}</p><h1>${esc(c.name)}</h1><p class="address">${esc(c.address)}</p><div class="facts"><span>${c.roomCount} ${c.roomCount===1?'sala':'salas'}</span>${c.tech.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><button class="btn ${cinemaSaved(id)?'primary':''}" style="color:${cinemaSaved(id)?'#081004':'var(--lime)'}" data-action="favorite" data-kind="cinema" data-id="${id}" aria-pressed="${cinemaSaved(id)}">${icon('heart')}<span>${cinemaSaved(id)?'Cinema salvo':'Favoritar cinema'}</span></button></header><div class="price-info"><button class="btn primary small" data-action="prices" data-id="${id}">Confira preços</button><p>Valores variam por sala, dia e tecnologia.</p></div><section class="program-section"><p class="eyebrow">Programação</p><h2>Sessões neste cinema</h2><div id="cinemaProgramContainer">${dates}<div id="cinemaProgram">${cinemaProgram(id)}</div></div></section></div></div>`;}
function comingPage(){const list=allMovies().filter(m=>status(m)!=='now'&&validDate(m.releaseDate));const years=unique(list.map(m=>m.releaseDate.slice(0,4))).sort();if(!years.includes(state.upcomingYear))state.upcomingYear=years[0];const months=unique(list.filter(m=>m.releaseDate.startsWith(state.upcomingYear)).map(m=>m.releaseDate.slice(5,7))).sort();if(!months.includes(state.upcomingMonth))state.upcomingMonth=months[0];const selected=list.filter(m=>m.releaseDate.startsWith(state.upcomingYear+'-'+state.upcomingMonth)).sort((a,b)=>a.releaseDate.localeCompare(b.releaseDate));const lead=movie('22941')||soonMovies()[0];return `<div class="page"><div class="shell"><header class="page-head"><h1>Em breve</h1></header>${lead?`<section class="feature" style="background-color:${esc(lead.colors?.[0]||'#15331c')}">${lead.backdrop?`<img src="${esc(lead.backdrop)}" alt="" data-fallback-image style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2">`:''}<div class="feature-inner"><div><p class="eyebrow">Em destaque</p><h2>${esc(lead.t)}</h2><div class="release-highlight"><small>Estreia</small><strong>${dateLabel(lead.releaseDate,true)}</strong></div><p>${esc(lead.syn)}</p><div class="actions"><a class="btn primary" href="${movieHref(lead.id)}">Ver filme ${icon('arrow')}</a>${saveButton(lead)}</div></div><a href="${movieHref(lead.id)}">${image(lead)}</a></div></section>`:''}<div class="calendar-controls"><div class="calendar-row" data-drag-rail aria-label="Ano">${years.map(y=>`<button class="chip ${y===state.upcomingYear?'active':''}" data-action="year" data-value="${y}">${y}</button>`).join('')}</div><div class="calendar-row" data-drag-rail aria-label="Mês">${months.map(m=>`<button class="chip ${m===state.upcomingMonth?'active':''}" data-action="month" data-value="${m}">${monthNames[Number(m)-1]}</button>`).join('')}</div></div><div class="rail" data-drag-rail>${selected.map(m=>card(m)).join('')}</div></div></div>`;}
const ACCOUNT_TABS=[['','Visão geral'],['salvos','Filmes favoritos'],['cinemas','Cinemas favoritos'],['preferencias','Preferências'],['conta','Conta']];
function accountPage(part=''){if(!logged())return loginPage();const p=profile();const saved=allMovies().filter(m=>movieSaved(m.id));const fav=sortedCinemas().filter(c=>cinemaSaved(c.id));let content='';
if(!part){content=`<p class="eyebrow">Minha Grozze</p><h1>Olá, ${esc(p.name.split(' ')[0])}.</h1><p class="muted">Seus filmes e cinemas, no mesmo lugar.</p><div class="account-stats"><a class="stat" href="#/minha-grozze/salvos"><b>${saved.length}</b><span>Filmes favoritos</span></a><a class="stat" href="#/minha-grozze/cinemas"><b>${fav.length}</b><span>Cinemas favoritos</span></a></div><section class="account-section"><div class="section-head"><h2>Filmes favoritos</h2><a class="text-link" href="#/minha-grozze/salvos">Ver todos →</a></div>${saved.length?`<div class="account-grid">${saved.slice(0,6).map(m=>card(m)).join('')}</div>`:`<div class="empty-state"><p>Guarde os filmes que você quer encontrar depois.</p><a class="btn" href="#/filmes">Descobrir filmes</a></div>`}</section><section class="account-section"><div class="section-head"><h2>Cinemas favoritos</h2><a class="text-link" href="#/cinemas?favoritos=1">Gerenciar →</a></div><div class="cinema-list">${fav.length?fav.map(cinemaCard).join(''):'<div class="empty-state"><p>Seus cinemas favoritos aparecerão aqui.</p><a class="btn" href="#/cinemas">Encontrar cinemas</a></div>'}</div></section>`;}
else if(part==='salvos'){content=`<h1>Filmes favoritos</h1>${saved.length?`<div class="account-grid">${saved.map(m=>card(m)).join('')}</div>`:'<div class="empty-state"><p>Nenhum filme salvo ainda.</p><a class="btn" href="#/filmes">Descobrir filmes</a></div>'}`;}
else if(part==='cinemas'){content=`<h1>Cinemas favoritos</h1><div class="cinema-list">${fav.length?fav.map(cinemaCard).join(''):'<div class="empty-state"><p>Nenhum cinema favorito ainda.</p><a class="btn" href="#/cinemas">Encontrar cinemas</a></div>'}</div>`;}
else if(part==='preferencias'||part==='alertas'){content=`<h1>Preferências</h1><p class="muted">Suas escolhas priorizam sessões compatíveis sem esconder as outras.</p><form class="form-panel" data-form="preferences"><label class="field"><span>Idioma preferido</span><select name="language">${['Todos','Legendado','Nacional','Dublado / original'].map(v=>`<option ${p.preferences?.language===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Experiência preferida</span><select name="format">${['Todos','IMAX','VIP','4DX','LED'].map(v=>`<option ${p.preferences?.format===v?'selected':''}>${v}</option>`).join('')}</select></label><p class="help">O envio de alertas não está ativo nesta homologação.</p><button class="btn primary" type="submit">Salvar preferências</button></form><div style="margin-top:20px"><button class="text-link" data-action="cookie-preferences">Preferências de cookies →</button></div>`;}
else{content=`<h1>Sua conta</h1><form class="form-panel" data-form="profile"><div class="avatar-options" role="group" aria-label="Escolha seu avatar">${['initial','star','moon','sun'].map(v=>`<button type="button" data-action="avatar" data-value="${v}" aria-pressed="${(p.avatar||'initial')===v}" aria-label="Avatar ${v}"><span class="avatar large">${v==='initial'?esc(p.name.charAt(0).toUpperCase()):{star:'★',moon:'☾',sun:'☀'}[v]}</span></button>`).join('')}</div><label class="field"><span>Nome</span><input name="name" value="${esc(p.name)}" maxlength="80" required autocomplete="name"></label><label class="field"><span>E-mail</span><input value="${esc(p.email)}" readonly></label><button type="submit" class="btn primary">Salvar dados</button><button type="button" class="text-link" data-action="logout" style="margin-left:15px">Sair</button></form><div style="margin-top:18px"><button class="text-link" data-action="cookie-preferences">Preferências de cookies →</button></div>`;}
return `<div class="page"><div class="shell account-layout"><aside class="account-aside"><div class="account-profile">${avatar('large')}<strong>${esc(p.name)}</strong><small>${esc(p.email)}</small></div><nav class="account-tabs" data-drag-rail aria-label="Minha Grozze">${ACCOUNT_TABS.map(([v,l])=>`<a class="${part===v?'active':''}" href="#/minha-grozze${v?'/'+v:''}">${l}</a>`).join('')}<button data-action="logout">Sair</button></nav></aside><section class="account-main" id="accountMain">${content}</section></div></div>`;}
function newsCard(n){return `<a class="news-card" href="${state.route.scope?'#/distribuidora/'+state.route.scope+'/noticia/':'#/noticia/'}${n.id}"><div class="news-thumb">${esc(n.k)}</div><div class="news-body"><h3>${esc(n.t)}</h3><p>${esc(n.p)}</p></div></a>`;}
function newsSection(items,title){if(!items.length)return '';return `<section class="section"><div class="shell"><div class="section-head"><div><p class="eyebrow">Editorial</p><h2>${title}</h2></div></div><div class="news-grid">${items.slice(0,3).map(newsCard).join('')}</div></div></section>`;}
function newsPage(){const categories=['Todos',...unique(SEED.news.map(n=>n.k))];return `<div class="page"><div class="shell"><header class="page-head"><h1>Notícias</h1></header><div class="filter-chips" style="margin-bottom:20px" data-drag-rail>${categories.map(c=>`<button class="chip ${c===state.newsFilter?'active':''}" data-action="news-filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="news-grid">${SEED.news.filter(n=>state.newsFilter==='Todos'||n.k===state.newsFilter).map(newsCard).join('')}</div></div></div>`;}
function articlePage(id){const n=SEED.news.find(n=>n.id===id);if(!n||state.route.scope&&n.dist!==state.route.scope)return notFound();const related=allMovies().filter(m=>m.dist===n.dist).slice(0,6);return `<div class="page"><article class="shell article"><p class="eyebrow">${esc(n.k)}</p><h1>${esc(n.t)}</h1><div class="news-thumb" style="height:190px;border-radius:18px;margin:23px 0">${esc(n.k)}</div><p>${esc(n.body)}</p><p class="help">Conteúdo editorial demonstrativo do protótipo.</p></article>${section('Filmes relacionados','',related,'')}</div>`;}
function publicInfoPage(root){let content='';if(root==='sobre')content=`<h1 class="about-intro">Menos procura.<br><em>Mais cinema.</em></h1><p>A Grozze reúne filmes, cinemas e sessões para ajudar você a encontrar sua próxima ida ao cinema.</p><h2>Do filme ao horário.</h2><p>Descubra o que está em cartaz, acompanhe as próximas estreias e compare as sessões. A compra é concluída com o parceiro responsável pela venda.</p><div class="actions"><a class="btn primary" href="#/filmes">Explorar filmes</a><a class="btn" href="#/cinemas">Encontrar cinemas</a></div>`;
else if(root==='faq'){content=`<h1>Perguntas frequentes</h1><div class="faq">${[['A Grozze vende ingressos?','A Grozze ajuda a encontrar a sessão. A compra e o atendimento do ingresso são realizados pelo parceiro de venda. Nesta homologação, o checkout não está integrado.'],['Preciso de uma conta para buscar sessões?','Não. Filmes, cinemas, horários e informações públicas podem ser consultados sem login. A conta permite guardar favoritos.'],['Onde encontro meus favoritos?','Em Minha Grozze, nas abas Filmes favoritos e Cinemas favoritos. Eles aparecem apenas quando você está identificado.'],['Como altero minha localização?','Use o botão de localização no topo. A geolocalização é opcional e depende da sua autorização no navegador.'],['Posso mudar minhas preferências de cookies?','Sim. O botão Preferências de cookies no rodapé e na sua conta abre o mesmo painel.'],['O que são horários simulados?','Esta versão usa uma agenda de setembro de 2026. Parte das datas foi replicada para testar a navegação; a confirmação da sessão informa essa condição.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`;}
else if(root==='privacidade'){content=`<h1>Política de Privacidade</h1><div class="notice">Informações desta homologação. A política de produção precisa identificar o controlador, os canais de atendimento, os prazos de retenção e as integrações efetivamente utilizadas antes da publicação.</div><h2>Dados neste protótipo</h2><p>Nome, e-mail, favoritos, preferências e formulários enviados são guardados neste navegador. Não há cadastro em servidor nem envio automático a um CRM. Não use dados sensíveis ou credenciais reais para testar.</p><h2>Localização</h2><p>A localização exata só é solicitada ao selecionar a opção de geolocalização. Ela é usada na sessão para calcular proximidade dos cinemas; não é enviada a um servidor da Grozze nesta versão.</p><h2>Serviços externos</h2><p>Imagens remotas podem ser carregadas dos endereços existentes no catálogo. O player de trailer e o mapa são carregados apenas quando acionados e utilizam serviços externos, sujeitos às políticas dos respectivos provedores.</p><h2>Preferências e controle</h2><p>Você pode rever a escolha de cookies no painel abaixo. Neste protótipo, não há ferramentas de publicidade ou analytics ativas. Limpar os dados do site no navegador remove o armazenamento local.</p><button class="btn" data-action="cookie-preferences">Preferências de cookies</button><h2>Contato</h2><p>O formulário de contato registra apenas uma mensagem local para homologação. O atendimento real e o canal do controlador devem ser configurados antes da operação pública.</p>`;}
else{content=`<h1>Termos de Uso</h1><div class="notice">Versão de homologação, sem venda integrada de ingressos e sem autenticação de produção. Este texto descreve o funcionamento testável do arquivo, não substitui os termos finais da operação.</div><h2>Consulta de filmes e sessões</h2><p>As informações exibidas correspondem a uma amostra congelada da agenda. Parte das datas foi replicada para testar a experiência. Consulte a disponibilidade atual e os valores no canal responsável pela venda antes de comprar.</p><h2>Compra e responsabilidade pelo ingresso</h2><p>A confirmação desta interface não emite, reserva ou compra ingressos. Regras de preço, taxas, cancelamento, meia-entrada e acesso devem ser verificadas junto ao parceiro vendedor.</p><h2>Conta e favoritos</h2><p>A identificação desta homologação é simulada. O armazenamento local permite testar favoritos e preferências, mas não representa uma conta segura de produção.</p><h2>Conteúdo e material promocional</h2><p>As artes e referências permanecem associadas aos titulares originais. A publicação comercial depende de autorização e das condições de uso de cada fonte.</p><h2>Privacidade</h2><p>Consulte a Política de Privacidade para conhecer o uso de armazenamento e serviços externos nesta versão.</p><a class="btn" href="#/privacidade">Política de Privacidade</a>`;}
return `<div class="page"><article class="shell article">${content}</article></div>`;}
function contactPage(root){const newsletter=root==='newsletter';return `<div class="page"><div class="shell article"><header class="page-head"><h1>${newsletter?'Fique por dentro':'Fale com a Grozze'}</h1><p>${newsletter?'Estreias e novidades que você quer acompanhar.':'Deixe sua mensagem.'}</p></header><form class="form-panel" data-form="${newsletter?'newsletter':'contact'}"><div class="form-grid"><label class="field"><span>Nome</span><input name="name" required maxlength="80" autocomplete="name"></label><label class="field"><span>E-mail</span><input name="email" type="email" required autocomplete="email"></label></div>${newsletter?'':`<label class="field"><span>Mensagem</span><textarea name="message" maxlength="3000" required></textarea></label>`}<label class="checkline"><input name="consent" type="checkbox" ${newsletter?'required':''}><span>${newsletter?'Autorizo o recebimento da newsletter.':'Desejo receber novidades por e-mail (opcional).'} <a href="#/privacidade">Política de Privacidade</a>.</span></label><p class="help">Formulário de homologação: o envio é registrado localmente, sem mensagem real.</p><button class="btn primary" type="submit">${newsletter?'Cadastrar':'Enviar mensagem'}</button></form></div></div>`;}
function loginForm(signup=false){return `<h2>${signup?'Criar minha conta':'Entrar'}</h2><p class="intro">${signup?'Guarde seus filmes e cinemas favoritos.':'Continue de onde parou.'}</p><div class="social-login"><button class="btn" disabled title="Integração não conectada nesta homologação">Google</button><button class="btn" disabled title="Integração não conectada nesta homologação">Apple</button></div><p class="help">Identificação de teste. Google e Apple ainda não estão conectados; não use credenciais reais.</p><form data-form="${signup?'signup':'login'}">${signup?'<label class="field"><span>Nome</span><input name="name" required maxlength="80" autocomplete="name"></label>':''}<label class="field"><span>E-mail</span><input name="email" type="email" placeholder="nome@exemplo.com" required autocomplete="email"></label>${signup?'':`<label class="field"><span>Senha de teste</span><input name="password" type="password" value="demonstracao" autocomplete="off" aria-describedby="password-note"><small class="help" id="password-note">A senha não é validada nem armazenada.</small></label>`}${signup?'<label class="checkline"><input name="consent" type="checkbox"><span>Quero receber novidades (opcional).</span></label>':''}<button class="btn primary full" type="submit">${signup?'Criar conta de teste':'Entrar na homologação'}</button></form><div style="margin-top:12px"><button class="btn full" data-action="demo-login">Entrar como usuário de teste</button></div><div class="auth-separator">${signup?'Já tem conta?':'Ainda não tem conta?'}</div><button class="text-link full" data-action="${signup?'auth':'signup'}">${signup?'Entrar':'Criar minha conta'}</button>`;}
function loginPage(signup=false){return `<div class="page"><div class="shell" style="max-width:530px"><div class="form-panel">${loginForm(signup)}</div></div></div>`;}
function distributorPage(slug){const d=SEED.distributors.find(x=>x.slug===slug&&x.status==='active'&&x.public);if(!d)return notFound();const list=allMovies().filter(m=>m.dist===slug);return `<div class="page"><div class="shell"><header class="page-head"><p class="eyebrow">${esc(d.formal)}</p><h1>${esc(d.name)}</h1></header></div>${list[0]?`<section class="hero"><div class="hero-asset">${list[0].backdrop?`<img src="${esc(list[0].backdrop)}" alt="" data-fallback-image>`:''}</div><div class="shell hero-inner" style="min-height:450px;padding-top:70px"><div class="hero-copy"><div class="eyebrow">${statusLabel(list[0])}</div><h1>${esc(list[0].t)}</h1>${meta(list[0])}<p class="synopsis">${esc(list[0].syn)}</p><a class="btn primary" href="${movieHref(list[0].id)}">Ver filme ${icon('arrow')}</a></div></div></section>`:''}${section('Nos cinemas','',list.filter(m=>hasSessions(m.id)),'')}${section('Vem aí','',list.filter(m=>!hasSessions(m.id)),'')}${newsSection(SEED.news.filter(n=>n.dist===slug),'Notícias')}</div>`;}
function cmsMovieEditor(id){const b=baseMovies.get(id);if(!b)return '<div class="empty-state">Escolha um filme.</div>';const o=state.content.movies[id]||{};const effective=movie(id);const fields=[['t','Título','text'],['releaseDate','Data de estreia','date'],['director','Direção','text'],['cast','Elenco (até quatro nomes)','text'],['genre','Gênero','text'],['dur','Duração','text'],['rating','Classificação','text'],['poster','Pôster — URL HTTPS','url'],['backdrop','Banner — URL HTTPS','url'],['trailer','Trailer — ID ou URL do YouTube','text']];return `<div class="cms-editor"><h2>${esc(effective.t)}</h2><p class="help">Campo vazio mantém o dado de origem. Publicar aplica o override a todas as telas.</p><details class="cms-source"><summary>Ver dado de origem e procedência</summary><pre>${esc(JSON.stringify({id:b.id,title:b.t,synopsis:b.syn,director:b.director,releaseDate:b.releaseDate,cast:b.cast,source:b.source,asOf:b.sourceAsOf,imdb:b.imdb?'Nota herdada do arquivo; não verificada novamente':null},null,2))}</pre></details><form data-form="cms" data-id="${id}"><div class="form-grid">${fields.map(([k,l,type])=>`<label class="field"><span>${l}</span><input name="${k}" type="${type}" value="${esc(k==='cast'?(o.cast||[]).join(', '):o[k]||'')}" ${k==='releaseDate'?'':`placeholder="${esc(['poster','backdrop'].includes(k)?'Manter imagem de origem':k==='cast'?(b.cast||[]).join(', '):b[k]||'Automático')}"`}></label>`).join('')}</div><label class="field"><span>Sinopse editorial</span><textarea name="syn" rows="6" placeholder="${esc(b.syn||'Sinopse ainda não fornecida pela origem')}">${esc(o.syn||'')}</textarea></label><div class="cms-actions"><button class="btn primary" type="submit">Publicar na homologação</button><button class="btn" type="button" data-action="remove-override" data-id="${id}">Restaurar automático</button><a class="btn" href="#/filme/${id}">Ver ficha</a></div><p class="help" style="margin-top:13px">Salvo neste navegador. Não publica em um servidor nem altera a base AIDA.</p></form></div>`;}
function cmsPage(){const tab=state.route.params.get('tab')||'filmes';const id=state.route.params.get('id')||[...baseMovies.keys()][0];const leads=storage.read(KEYS.leads,[]);let content='';if(tab==='filmes'){content=`<div class="cms-layout"><aside class="cms-list" aria-label="Filmes no CMS">${allMovies().map(m=>`<a class="${m.id===id?'active':''}" href="#/admin/cms?tab=filmes&id=${m.id}">${esc(m.t)}<small>${m.id} · ${statusLabel(m)}${Object.hasOwn(state.content.movies,m.id)?' · Override':''}</small></a>`).join('')}</aside><div id="cmsEditor">${cmsMovieEditor(id)}</div></div>`;}
else if(tab==='leads'){content=`<div class="section-head"><div><h2>Leads e formulários</h2><p>Base local separada do conteúdo editorial.</p></div><button class="btn" data-action="export-leads">Exportar CSV</button></div>${leads.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Data</th><th>Nome</th><th>E-mail</th><th>Origem</th><th>Marketing</th></tr></thead><tbody>${leads.map(l=>`<tr><td>${esc(l.createdAt.slice(0,10))}</td><td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${esc(l.source)}</td><td>${l.marketingConsent?'Autorizado':'Não autorizado'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">Nenhum formulário recebido neste navegador.</div>'}<p class="help" style="margin-top:15px">Não há envio a CRM ou campanha de e-mail. Não confunda cadastro com consentimento para marketing.</p>`;}
else if(tab==='auditoria'){const entries=storage.read(KEYS.audit,[]);content=`<h2>Histórico editorial</h2><div class="audit-list">${entries.map(a=>`<div class="audit-entry"><small>${esc(a.date)} · ${esc(a.actor)}</small><strong>${esc(a.action)} · ${esc(movie(a.id)?.t||a.id)}</strong><div>${esc(a.fields.join(', '))}</div></div>`).join('')||'<div class="empty-state">Nenhuma intervenção registrada.</div>'}</div>`;}
else{content=`<h2>Snapshot e integrações</h2><div class="form-panel"><p><strong>${SEED.movies.length} filmes · ${SEED.cinemas.length} cinemas · ${sessions.length} sessões</strong></p><p class="muted">${esc(SEED.meta.caveat)}</p><p class="help">Os títulos de Em breve foram incorporados à mesma coleção. Todas as telas, incluindo a Home e o CMS, usam o mesmo resolvedor de conteúdo.</p><div class="actions"><button class="btn" data-action="export-content">Exportar overrides JSON</button><label class="btn">Importar overrides<input id="contentImport" type="file" accept="application/json" hidden></label><button class="btn" data-action="snapshot-info">Detalhes do ambiente</button></div></div><div class="form-panel" style="margin-top:18px"><h3>Antes de produção</h3><p class="muted">Conectar API autorizada AIDA, autenticação/ACL, banco de usuários, CRM, serviço de consentimento e canal de compra por sessão. Este painel local não é uma área administrativa protegida.</p></div>`;}
return `<div class="page"><div class="shell"><header class="page-head"><p class="eyebrow">Conteúdo e operação</p><h1>Grozze CMS</h1></header><div class="admin-banner">Homologação local. Este painel não possui autorização de produção. Não armazene dados pessoais reais ou credenciais.</div><nav class="cms-tabs" data-drag-rail>${[['filmes','Filmes'],['leads','Leads'],['auditoria','Auditoria'],['dados','Dados e integrações']].map(([v,l])=>`<a class="chip ${v===tab?'active':''}" href="#/admin/cms?tab=${v}">${l}</a>`).join('')}</nav>${content}</div></div>`;}
function notFound(){return '<div class="page"><div class="shell empty-state"><h1>Página não encontrada</h1><p>Este conteúdo não está disponível neste endereço.</p><a class="btn" href="#/inicio">Voltar ao início</a></div></div>';}
let renderCount=0,heroTimer=null,overlayFocus=null,pendingTrailer=null,toastTimer=null;
function choosePage(r){if(r.scope){if(r.parts[2]==='filme')return moviePage(r.parts[3]);if(r.parts[2]==='noticia')return articlePage(r.parts[3]);return distributorPage(r.scope);}switch(r.root){case'inicio':return home();case'filmes':return filmsPage();case'filme':return moviePage(r.id);case'cinemas':return cinemasPage();case'cinema':return cinemaPage(r.id);case'em-breve':return comingPage();case'minha-grozze':return accountPage(r.id);case'entrar':return loginPage();case'cadastro':return loginPage(true);case'noticias':return newsPage();case'noticia':return articlePage(r.id);case'newsletter':case'contato':return contactPage(r.root);case'sobre':case'faq':case'privacidade':case'termos':return publicInfoPage(r.root);case'admin':return cmsPage();default:return notFound();}}
function renderPage({preserveScroll=false}={}){const y=window.scrollY;clearInterval(heroTimer);heroTimer=null;const r=getRoute();state.route=r;if(r.root==='filmes'&&r.params.has('status'))state.filmStatus=r.params.get('status');document.body.dataset.route=r.scope?(r.parts[2]==='filme'?'filme':'distribuidora'):r.root;document.body.classList.toggle('has-hero',r.root==='inicio'||r.root==='filme'||r.scope&&r.parts[2]==='filme');renderHeader();renderFooter();try{qs('#app').innerHTML=choosePage(r);renderCount++;}catch(e){console.error('Erro de renderização Grozze',e);qs('#app').innerHTML='<div class="page"><div class="shell empty-state"><h1>Não foi possível carregar esta página.</h1><p>Tente voltar ao início. O erro foi registrado no console para revisão.</p><a class="btn" href="#/inicio">Voltar ao início</a></div></div>';}
renderCookieBanner();setupRails();updateSticky();if(preserveScroll)window.scrollTo({top:y,behavior:'instant'});else window.scrollTo({top:0,behavior:'instant'});if(r.root==='inicio')heroTimer=setInterval(()=>{if(!state.heroPaused&&!document.hidden&&!state.overlay&&!qs('#homeHero')?.matches(':hover')&&!qs('#homeHero')?.contains(document.activeElement))changeHero(state.heroIndex+1);},7500);
if(r.params.get('focus')==='sessoes')requestAnimationFrame(scrollToSessions);if(pendingTrailer&&(r.root==='filme'||r.scope&&r.parts[2]==='filme')){const id=pendingTrailer;pendingTrailer=null;requestAnimationFrame(()=>openTrailer(id));}document.title=(r.root==='filme'?movie(r.id)?.t+' · ':r.root==='admin'?'CMS · ':'')+'Grozze';}
function changeHero(i){const list=currentMovies().slice(0,5);if(!list.length)return;state.heroIndex=(i+list.length)%list.length;const old=qs('#homeHero');if(old){const y=window.scrollY;old.outerHTML=homeHero();window.scrollTo({top:y,behavior:'instant'});}}
function updateSticky(){document.body.classList.toggle('scrolled',window.scrollY>30);const hero=qs('#movieHero');const bar=qs('#movieSticky');if(!hero||state.overlay||hero.getBoundingClientRect().bottom>Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header'))+10){bar.hidden=true;return;}const m=movie(hero.dataset.movie);if(!m){bar.hidden=true;return;}bar.hidden=false;bar.innerHTML=`<div class="shell sticky-inner">${image(m)}<div><small>${statusLabel(m)}</small><strong>${esc(m.t)}</strong></div></div>`;}
let scrollTick=false;window.addEventListener('scroll',()=>{if(!scrollTick){scrollTick=true;requestAnimationFrame(()=>{updateSticky();scrollTick=false;});}},{passive:true});
function scrollToSessions(){qs('#sessoes')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}
function setupRails(){qsa('[data-drag-rail]').forEach(rail=>{if(rail.dataset.dragReady)return;rail.dataset.dragReady='1';let start=null,dragged=false,suppress=false;rail.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('input,select,[data-action=favorite]'))return;start={x:e.clientX,y:e.clientY,left:rail.scrollLeft,id:e.pointerId};dragged=false;});rail.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(!dragged&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){dragged=true;rail.classList.add('dragging');rail.setPointerCapture(e.pointerId);}if(dragged){e.preventDefault();rail.scrollLeft=start.left-dx;}});const end=e=>{if(!start)return;if(dragged){suppress=true;setTimeout(()=>{suppress=false;},100);try{rail.releasePointerCapture(start.id);}catch{}}start=null;rail.classList.remove('dragging');};rail.addEventListener('pointerup',end);rail.addEventListener('pointercancel',end);rail.addEventListener('pointerleave',e=>{if(!dragged)start=null;});rail.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopImmediatePropagation();suppress=false;}},true);rail.addEventListener('dragstart',e=>e.preventDefault());});}
function toast(msg){const el=qs('#toast');clearTimeout(toastTimer);el.textContent=msg;el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;},3200);}
function setOverlayBackground(active){for(const id of ['app','header','footer','bottomNav','movieSticky','consent-root']){const element=document.getElementById(id);if(element)element.inert=active;}}
function showDialog(content,{wide=false,video=false,menu=false,session=false,label='Grozze'}={}){if(!state.overlay)overlayFocus=document.activeElement;state.overlay={kind:menu?'menu':session?'session':video?'video':'dialog'};const root=qs('#overlay-root');root.innerHTML=`<div class="overlay ${menu?'menu-overlay':''} ${session?'session-dialog':''}" data-action="overlay-backdrop"><section class="dialog ${wide?'wide':''} ${video?'video':''} ${menu?'menu-panel':''}" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1"><button class="close-btn" data-action="close-overlay" aria-label="Fechar">${icon('close')}</button>${content}</section></div>`;document.body.classList.add('has-overlay');document.body.style.overflow='hidden';setOverlayBackground(true);updateSticky();requestAnimationFrame(()=>{(root.querySelector('input:not([type=checkbox])')||root.querySelector('.dialog')).focus({preventScroll:true});});}
function closeDialog({keepPending=false}={}){qs('#overlay-root').replaceChildren();state.overlay=null;document.body.style.overflow='';document.body.classList.remove('has-overlay');setOverlayBackground(false);if(!keepPending)state.pending=null;updateSticky();if(overlayFocus?.isConnected)overlayFocus.focus({preventScroll:true});overlayFocus=null;}
function openAuth(signup=false){showDialog(loginForm(signup),{label:signup?'Criar conta':'Entrar'});state.overlay.kind='auth';}
function applyFavorite(kind,id,force=null){if(!profile())return;const key=kind==='movie'?'savedMovies':'savedCinemas';const set=new Set(arrayIds(profile()[key]));const next=force===null?!set.has(id):force;next?set.add(id):set.delete(id);profile()[key]=[...set];persisted();refreshPersonalUi();toast(next?(kind==='movie'?'Filme salvo':'Cinema salvo'):(kind==='movie'?'Filme removido dos favoritos':'Cinema removido dos favoritos'));}
function requestFavorite(kind,id){id=String(id);if(!logged()){state.pending={kind,id,route:location.hash,scrollY:window.scrollY};openAuth();return;}applyFavorite(kind,id);}
function refreshPersonalUi(){const y=window.scrollY;renderHeader();const r=state.route;
qsa('[data-action=favorite]').forEach(b=>{const kind=b.dataset.kind,id=b.dataset.id,on=kind==='movie'?movieSaved(id):cinemaSaved(id);b.setAttribute('aria-pressed',String(on));if(b.classList.contains('heart-btn')){b.setAttribute('aria-label',(on?'Remover dos favoritos ':'Favoritar ')+(kind==='movie'?movie(id)?.t:cinema(id)?.name));}else if(b.classList.contains('save-action')){b.innerHTML=icon(on?'check':'heart')+`<span>${on?'Salvo':'Salvar'}</span>`;}else if(b.closest('.cinema-header')){b.classList.toggle('primary',on);b.style.color=on?'#081004':'var(--lime)';b.innerHTML=icon('heart')+`<span>${on?'Cinema salvo':'Favoritar cinema'}</span>`;}});
qsa('[data-movie-card]').forEach(c=>{const m=movie(c.dataset.movieCard);if(!m)return;const rank=c.querySelector('.rank-tag strong')?.textContent;const holder=document.createElement('div');holder.innerHTML=card(m,{rank:rank?Number(rank):null});c.replaceWith(holder.firstElementChild);});
if(qs('#programLists'))qs('#programLists').innerHTML=programLists(qs('[data-program-movie]').dataset.programMovie);
if(qs('#cinemaList'))qs('#cinemaList').innerHTML=cinemaListHtml();
if(r.root==='minha-grozze'){qs('#app').innerHTML=accountPage(r.id);}
if(r.root==='inicio'){const f=qs('#homeFavorites');const markup=favoritesHome();if(f){if(markup)f.outerHTML=markup;else f.remove();}else if(markup)qs('#nearby')?.insertAdjacentHTML('beforebegin',markup);}
setupRails();window.scrollTo({top:y,behavior:'instant'});}
function completeLogin(name,email,signup=false,consent=false){email=email.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Informe um e-mail válido.');return;}const pending=state.pending;const prev=Object.hasOwn(profiles,email)?profiles[email]:null;profiles[email]={name:name.trim()||prev?.name||email.split('@')[0],email,savedMovies:arrayIds(prev?.savedMovies),savedCinemas:arrayIds(prev?.savedCinemas),avatar:prev?.avatar||'initial',preferences:prev?.preferences||{language:'Todos',format:'Todos'}};state.userKey=email;persisted();tabStorage.write(KEYS.session,{email,mode:'demo'});if(signup)captureLead({source:'Cadastro',name:profiles[email].name,email,marketingConsent:consent});closeDialog({keepPending:true});if(['entrar','cadastro'].includes(state.route.root)&&!pending)navigate('/minha-grozze');else renderPage({preserveScroll:true});if(pending){state.pending=null;applyFavorite(pending.kind,pending.id,true);window.scrollTo({top:pending.scrollY,behavior:'instant'});}else toast('Você entrou na conta de teste.');}

function validateOverride(input){const o={};for(const k of ['t','syn','director','genre','dur','rating','poster','backdrop','trailer','trailerTitle','releaseDate']){const v=String(input[k]??'').trim();if(!v)continue;if(v.length>10000)throw Error('Campo muito longo.');if(['poster','backdrop'].includes(k)&&!safeImage(v))throw Error('Use uma URL HTTPS válida para imagens.');if(k==='trailer'&&!videoId(v))throw Error('Informe um ID ou link válido do YouTube.');if(k==='releaseDate'&&!validDate(v))throw Error('Informe uma data de estreia válida.');o[k]=k==='trailer'?videoId(v):v;}const cast=Array.isArray(input.cast)?input.cast:String(input.cast||'').split(',');const names=cast.filter(x=>typeof x==='string').map(x=>x.trim()).filter(Boolean).slice(0,4);if(names.length)o.cast=names;return o;}

// Read-only observability for QA; does not contain authentication credentials.
window.Grozze=Object.freeze({version:'V1-RC2',inspect:()=>({route:state.route,logged:logged(),name:profile()?.name||null,initial:profile()?.name?.charAt(0)||null,catalogCount:baseMovies.size,sessionCount:sessions.length,renderCount,storagePersistent:storage.persistent,overlay:state.overlay?.kind||null,consent:state.consent}),catalog:()=>allMovies().map(m=>({...m,displayStatus:status(m)})),sessions:()=>sessions.map(s=>({...s})),favorites:()=>({movies:logged()?arrayIds(profile().savedMovies):[],cinemas:logged()?arrayIds(profile().savedCinemas):[]})});
renderPage();
})();
</script></body></html>
